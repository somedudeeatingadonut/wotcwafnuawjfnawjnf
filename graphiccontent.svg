<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14090d"/>
      <stop offset="0.5" stop-color="#1e0d13"/>
      <stop offset="1" stop-color="#0c070a"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3355"/>
      <stop offset="1" stop-color="#ff7755"/>
    </linearGradient>
    <pattern id="hatch" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="13" height="26" fill="rgba(255,60,80,0.10)"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#hatch)"/>
  <rect x="0" y="0" width="1280" height="14" fill="url(#stripe)"/>
  <rect x="0" y="706" width="1280" height="14" fill="url(#stripe)"/>

  <!-- crossed-out eye -->
  <g transform="translate(640 300)" fill="none" stroke="#ff5566" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-150 0 C -90 -95, 90 -95, 150 0 C 90 95, -90 95, -150 0 Z" opacity="0.95"/>
    <circle cx="0" cy="0" r="46" fill="#ff5566" stroke="none"/>
    <circle cx="14" cy="-14" r="14" fill="#1e0d13" stroke="none"/>
    <line x1="-176" y1="132" x2="176" y2="-132" stroke-width="22"/>
    <line x1="-176" y1="132" x2="176" y2="-132" stroke="#0c070a" stroke-width="8"/>
  </g>

  <text x="640" y="500" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800"
        fill="#ffffff" text-anchor="middle" letter-spacing="6">GRAPHIC CONTENT</text>
  <text x="640" y="556" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600"
        fill="#ff8899" text-anchor="middle" letter-spacing="3">IMAGE HIDDEN BY LUMEN MODE</text>
  <text x="640" y="618" font-family="Arial, Helvetica, sans-serif" font-size="24"
        fill="rgba(255,255,255,0.65)" text-anchor="middle">Click the warning overlay to reveal it anyway</text>
</svg>
